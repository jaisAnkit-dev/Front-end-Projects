<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Contact Us</title>
   <link rel="stylesheet" href="style.css">
   <script src="https://kit.fontawesome.com/00e155ab3b.js" crossorigin="anonymous"></script>
</head>
<body>
   <section class="container">
   
      <div class="info">
         <div class="address">
            <i class="fa-solid fa-location-dot media-icons" style="color: rgb(60, 32, 149);"></i>
            <h2>Address</h2>
            <p>Surkhet, NP12</p>
            <p>Birendranagar 06</p>
         </div>

         <div class="phone">
            <i class="fa-solid fa-phone media-icons" style="color: rgb(60, 32, 149);"></i>
            <h2>Phone</h2>
            <p>+0055447112</p>
            <p>+0022298831</p>
         </div>

         <div class="email">
            <i class="fa-solid fa-envelope media-icons" style="color: rgb(60, 32, 149);"></i>
            <h2>Email</h2>
            <p>ankitjaiswal@gmail.com</p>
            <p>jaisankit@gmail.com</p>
         </div>
      </div>

      <div class="form-section">
         <h2>Send us a message</h2>
         <p>If you have any work for me or any type of queries related to my work, you can send me message from here. It's my pleasure to help you.</p>

         <form action="#">
            <input class="input-boxes" type="text" name="name" id="name" placeholder="Enter your name">
            <input class="input-boxes" type="email" name="name" id="email" placeholder="Enter your mail">
            <textarea class="input-boxes message-box" id="message" placeholder="Enter your message"></textarea>

            <input type="button" value="Send Now" class="send-button">
         </form>
      </div>

   </section>
</body>
</html>
