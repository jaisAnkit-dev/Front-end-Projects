<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>QR Code Design</title>
   <link rel="stylesheet" href="styles/style.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
   <section class="main-container">
      <div class="container">
         <div class="image-box">
            <img class="image" src="images/image-qr-code.png" alt="QR-Code-image">
         </div>
         <h2 class="heading">Improving my front-end skills by building projects</h2>
         <p class="para">Scan the QR Code to visit my website and take a look at my next level front-end coding skills</p>
      </div>
   </section>
</body>
</html>
