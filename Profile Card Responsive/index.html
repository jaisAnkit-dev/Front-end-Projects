<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Profile Card</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
   <script src="https://kit.fontawesome.com/00e155ab3b.js" crossorigin="anonymous"></script>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="main-container">

      <div class="top-container">
         <div class="logo-box">
            <img src="Images/profile-card-img.jpg" alt="" class="logo">
         </div>
      </div>

      <div class="bottom-container">
         <div class="bottom-content">

            <div class="text">
               <h3>Ankit Jaiswal</h3>
               <p>Coder & Designer</p>
            </div>

            <div class="social-icons">
               <a href="#" class="facebook"><i class="fa-brands fa-facebook-f" style="color: rgb(255, 255, 255);"></i></a>
               <a href="#" class="x"><i class="fa-brands fa-x-twitter" style="color: rgb(255, 255, 255);"></i></a>
               <a href="#" class="instagram"><i class="fa-brands fa-instagram" style="color: rgb(255, 255, 255);"></i></a>
               <a href="#" class="youtube"><i class="fa-brands fa-youtube" style="color: rgb(255, 255, 255);"></i></a>
               
            </div>

            <div class="buttons">
               <button class="subscribe">Subscribe</button>
               <button class="message">Message</button>
            </div>

            <div class="bottom-icons">
               <div class="like">
                  <i class="fa-regular fa-heart" style="color: rgb(55, 55, 55);"></i>
                  <p class="count">60k</p>
               </div>
               <p class="icon-bar">|</p>
               <div class="comment">
                  <i class="fa-regular fa-comment" style="color: rgb(55, 55, 55);"></i>
                  <p class="count">20k</p>
               </div>
               <p class="icon-bar">|</p>
               <div class="share">
                  <i class="fa-regular fa-share-from-square" style="color: rgb(55, 55, 55);"></i>
                  <p class="count">12k</p>
               </div>  
            </div>

         </div>
      </div>
   </div>
</body>
</html>
